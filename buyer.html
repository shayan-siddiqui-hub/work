<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Al-Hamd Engeeniers | Shop</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* HEADER */

        header {
            background: #0b1f3a;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #21c7ff;
        }

        nav {
            display: flex;
            gap: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 7px;
        }

        nav a:hover {
            background: #21c7ff;
            color: #071b30;
        }

        /* HERO */

        .hero {
            background: linear-gradient(
                rgba(5, 27, 54, .92),
                rgba(5, 27, 54, .92)
            );

            color: white;
            text-align: center;
            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            color: #d9f6ff;
        }

        /* SHOP */

        .shop {
            width: 92%;
            max-width: 1400px;
            margin: 40px auto;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .search {
            flex: 1;
        }

        .search input,
        .category {
            width: 100%;
            padding: 14px;
            border: 1px solid #d5dce5;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .category {
            width: 230px;
        }

        /* PRODUCTS */

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(250px, 1fr));

            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
            transition: .3s;
        }

        .product:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,.15);
        }

        .product-image {
            height: 230px;
            background: #edf2f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 20px;
        }

        .category-label {
            display: inline-block;
            background: #e5f8ff;
            color: #0785ad;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .product h3 {
            color: #10243c;
            margin-bottom: 8px;
        }

        .description {
            color: #6d7885;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .price {
            color: #0785ad;
            font-size: 21px;
            font-weight: bold;
        }

        .stock {
            font-size: 13px;
            color: #687585;
        }

        .cart-btn {
            width: 100%;
            border: none;
            padding: 13px;
            background: #0b1f3a;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-btn:hover {
            background: #21aee0;
            color: #071b30;
        }

        .cart-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        /* CART */

        .cart {
            background: white;
            margin-top: 50px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.07);
        }

        .cart h2 {
            color: #0b1f3a;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #e4e9ee;
            padding: 15px 0;
        }

        .cart-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h4 {
            margin-bottom: 5px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: none;
            background: #0b1f3a;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove {
            background: #e53935 !important;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            padding-top: 20px;
            margin-top: 20px;
            border-top: 2px solid #e5e9ee;
        }

        .total span:last-child {
            color: #0785ad;
        }

        .checkout {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: #0785ad;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .checkout:hover {
            background: #056d8d;
        }

        .empty {
            text-align: center;
            color: #7b8794;
            padding: 30px;
        }

        /* FOOTER */

        footer {
            margin-top: 60px;
            padding: 25px;
            background: #0b1f3a;
            color: white;
            text-align: center;
        }

        /* MOBILE */

        @media(max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .hero h1 {
                font-size: 32px;
            }

            .controls {
                flex-direction: column;
            }

            .category {
                width: 100%;
            }

            .cart-item {
                flex-wrap: wrap;
            }
        }

    </style>
</head>

<body>


<!-- HEADER -->

<header>

    <div class="logo">
        Al-Hamd <span>Engeeniers</span>
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="seller.php">
            Seller
        </a>

        <a href="buyer.html">
            Shop
        </a>

        <a href="#cart">
            🛒 Cart (<span id="cartCount">0</span>)
        </a>

    </nav>

</header>


<!-- HERO -->

<section class="hero">

    <h1>
        Engineering Equipment Shop
    </h1>

    <p>
        Find professional surveying and engineering equipment
        at Al-Hamd Engeeniers.
    </p>

</section>


<!-- SHOP -->

<section class="shop">

    <div class="controls">

        <div class="search">

            <input
                type="text"
                id="search"
                placeholder="Search products..."
                onkeyup="filterProducts()"
            >

        </div>

        <select
            class="category"
            id="category"
            onchange="filterProducts()"
        >

            <option value="all">
                All Categories
            </option>

        </select>

    </div>


    <!-- PRODUCTS FROM DATABASE -->

    <div
        class="products"
        id="products"
    >

        <div class="empty">
            Loading products...
        </div>

    </div>


    <!-- CART -->

    <div
        class="cart"
        id="cart"
    >

        <h2>
            🛒 Shopping Cart
        </h2>

        <div id="cartItems">

            <div class="empty">
                Your cart is empty.
            </div>

        </div>

        <div
            class="total"
            id="totalBox"
            style="display:none;"
        >

            <span>
                Total
            </span>

            <span id="total">
                Rs. 0.00
            </span>

        </div>

        <button
            class="checkout"
            id="checkoutButton"
            style="display:none;"
            onclick="goToCheckout()"
        >
            Proceed to Checkout
        </button>

    </div>

</section>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 Al-Hamd Engeeniers.
        All Rights Reserved.
    </p>

</footer>


<script>

/* ==========================================================
   CART
========================================================== */

let cart = JSON.parse(
    localStorage.getItem("alHamdCart") || "[]"
);


/* ==========================================================
   LOAD PRODUCTS FROM PHP API
========================================================== */

async function loadProducts() {

    const productsContainer =
        document.getElementById("products");

    try {

        const response =
            await fetch("products_api.php");

        const data =
            await response.json();


        if (!data.success) {

            productsContainer.innerHTML = `
                <div class="empty">
                    Unable to load products.
                </div>
            `;

            return;
        }


        productsContainer.innerHTML = "";


        if (data.products.length === 0) {

            productsContainer.innerHTML = `
                <div class="empty">
                    No products have been added yet.
                </div>
            `;

            return;
        }


        const categories = [];


        data.products.forEach(product => {

            if (
                product.category &&
                !categories.includes(product.category)
            ) {

                categories.push(product.category);

            }


            const card =
                document.createElement("div");

            card.className = "product";

            card.setAttribute(
                "data-name",
                (
                    product.product_name +
                    " " +
                    product.category +
                    " " +
                    (product.brand || "")
                ).toLowerCase()
            );

            card.setAttribute(
                "data-category",
                (product.category || "").toLowerCase()
            );


            let imageHTML = `
                <div style="
                    color:#888;
                    text-align:center;
                ">
                    No Image
                </div>
            `;


            if (product.image) {

                imageHTML = `
                    <img
                        src="uploads/${escapeHTML(product.image)}"
                        alt="${escapeHTML(product.product_name)}"
                    >
                `;

            }


            const stock =
                Number(product.stock);


            card.innerHTML = `

                <div class="product-image">
                    ${imageHTML}
                </div>

                <div class="product-info">

                    <span class="category-label">
                        ${escapeHTML(product.category)}
                    </span>

                    <h3>
                        ${escapeHTML(product.product_name)}
                    </h3>

                    ${
                        product.brand
                        ? `<p style="
                            font-size:13px;
                            color:#777;
                            margin-bottom:10px;
                        ">
                            Brand:
                            ${escapeHTML(product.brand)}
                        </p>`
                        : ""
                    }

                    <div class="description">
                        ${escapeHTML(
                            product.description ||
                            "Quality engineering equipment."
                        )}
                    </div>

                    <div class="price-row">

                        <span class="price">
                            Rs.
                            ${Number(product.price).toFixed(2)}
                        </span>

                        <span class="stock">
                            ${stock > 0
                                ? stock + " available"
                                : "Out of stock"}
                        </span>

                    </div>

                    <button
                        class="cart-btn"
                        ${stock <= 0 ? "disabled" : ""}
                        onclick='addToCart(
                            ${JSON.stringify({
                                id: Number(product.id),
                                name: product.product_name,
                                price: Number(product.price),
                                stock: stock,
                                image: product.image || ""
                            })}
                        )'
                    >
                        ${
                            stock > 0
                            ? "🛒 Add to Cart"
                            : "Out of Stock"
                        }
                    </button>

                </div>
            `;


            productsContainer.appendChild(card);

        });


        /* Add categories */

        const categorySelect =
            document.getElementById("category");


        categories.forEach(cat => {

            const option =
                document.createElement("option");

            option.value =
                cat.toLowerCase();

            option.textContent =
                cat;

            categorySelect.appendChild(option);

        });

    }

    catch (error) {

        console.error(error);

        productsContainer.innerHTML = `
            <div class="empty">
                Could not connect to the database.
                <br><br>
                Make sure products_api.php is running.
            </div>
        `;

    }

}


/* ==========================================================
   ADD TO CART
========================================================== */

function addToCart(product) {

    const existing =
        cart.find(
            item =>
            Number(item.id) === Number(product.id)
        );


    if (existing) {

        if (
            existing.quantity >=
            Number(product.stock)
        ) {

            alert(
                "You have reached the available stock."
            );

            return;
        }

        existing.quantity++;

    } else {

        cart.push({

            id: Number(product.id),

            name: product.name,

            price: Number(product.price),

            stock: Number(product.stock),

            image: product.image,

            quantity: 1

        });

    }


    saveCart();

    renderCart();

}


/* ==========================================================
   REMOVE FROM CART
========================================================== */

function removeFromCart(id) {

    cart =
        cart.filter(
            item =>
            Number(item.id) !== Number(id)
        );

    saveCart();

    renderCart();

}


/* ==========================================================
   CHANGE QUANTITY
========================================================== */

function changeQuantity(id, change) {

    const item =
        cart.find(
            item =>
            Number(item.id) === Number(id)
        );


    if (!item) {
        return;
    }


    item.quantity += change;


    if (item.quantity <= 0) {

        removeFromCart(id);

        return;

    }


    if (
        item.quantity >
        Number(item.stock)
    ) {

        item.quantity =
            Number(item.stock);

        alert(
            "Maximum available stock is " +
            item.stock
        );

    }


    saveCart();

    renderCart();

}


/* ==========================================================
   RENDER CART
========================================================== */

function renderCart() {

    const container =
        document.getElementById("cartItems");

    const totalBox =
        document.getElementById("totalBox");

    const checkout =
        document.getElementById("checkoutButton");


    document.getElementById(
        "cartCount"
    ).textContent =
        cart.reduce(
            (sum, item) =>
            sum + Number(item.quantity),
            0
        );


    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Your cart is empty.
            </div>
        `;

        totalBox.style.display = "none";

        checkout.style.display = "none";

        return;
    }


    container.innerHTML = "";

    let total = 0;


    cart.forEach(item => {

        const subtotal =
            Number(item.price) *
            Number(item.quantity);


        total += subtotal;


        const div =
            document.createElement("div");

        div.className = "cart-item";


        div.innerHTML = `

            <img
                src="${
                    item.image
                    ? "uploads/" + escapeHTML(item.image)
                    : ""
                }"
                alt="${escapeHTML(item.name)}"
            >

            <div class="cart-info">

                <h4>
                    ${escapeHTML(item.name)}
                </h4>

                <span>
                    Rs.
                    ${Number(item.price).toFixed(2)}
                </span>

            </div>

            <div class="quantity">

                <button
                    onclick="changeQuantity(${item.id}, -1)"
                >
                    −
                </button>

                <strong>
                    ${item.quantity}
                </strong>

                <button
                    onclick="changeQuantity(${item.id}, 1)"
                >
                    +
                </button>

                <button
                    class="remove"
                    onclick="removeFromCart(${item.id})"
                >
                    ×
                </button>

            </div>

        `;


        container.appendChild(div);

    });


    document.getElementById("total").textContent =
        "Rs. " + total.toFixed(2);


    totalBox.style.display = "flex";

    checkout.style.display = "block";

}


/* ==========================================================
   SAVE CART
========================================================== */

function saveCart() {

    localStorage.setItem(
        "alHamdCart",
        JSON.stringify(cart)
    );

}


/* ==========================================================
   SEARCH / CATEGORY FILTER
========================================================== */

function filterProducts() {

    const search =
        document.getElementById(
            "search"
        ).value.toLowerCase();


    const category =
        document.getElementById(
            "category"
        ).value.toLowerCase();


    const products =
        document.querySelectorAll(
            ".product"
        );


    products.forEach(product => {

        const name =
            product.getAttribute(
                "data-name"
            ) || "";


        const productCategory =
            product.getAttribute(
                "data-category"
            ) || "";


        const searchMatch =
            name.includes(search);


        const categoryMatch =
            category === "all" ||
            productCategory === category;


        product.style.display =
            searchMatch && categoryMatch
            ? ""
            : "none";

    });

}


/* ==========================================================
   CHECKOUT
========================================================== */

function goToCheckout() {

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }


    /*
       The actual checkout/order processing
       is handled by buyer.php.
    */

    window.location.href =
        "buyer.php#cart";

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;

}


/* ==========================================================
   START
========================================================== */

loadProducts();

renderCart();

</script>

</body>
</html>
